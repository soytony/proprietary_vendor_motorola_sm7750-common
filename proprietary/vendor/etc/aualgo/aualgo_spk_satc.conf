#
# Smart Audio Thermal Control
#
enable = 1                          # 总开关：1开启，0关闭
target = "Equator"                  # 项目（首字母大写）
algo_ver = "1.13.0"
config_ver = "20260113.1"


#
# 基本参数：
#

## 手机正面温度
front_ntc_high_tmpr = 44            # 当正面壳温 升到此上限温度时，准备降温
## 上喇叭温度 
spk1_ntc_high_tmpr = 43             # 当上喇叭壳温 升到此上限温度时，准备降温
spk1_ntc_low_tmpr = 39              # 当上喇叭壳温 降到此下限温度时，准备恢复系数
## 下喇叭温度
spk2_ntc_high_tmpr = 43             # 当下喇叭壳温 升到此上限温度时，准备降温
spk2_ntc_low_tmpr = 39              # 当下喇叭壳温 降到此下限温度时，准备恢复系数

high_temp_seconds = 30              # 到达上限温度后的持续时间
low_temp_seconds = 30               # 到达下限温度后的持续时间
cooling_seconds = 30                # 当执行完降温策略后，延迟多少秒等待降温效果

#
# 高级参数：
#
front_ntc_name = "front_temp"       # NTC传感器 (手机正面NTC)
spk1_ntc_name = "spkr-therm"        # NTC传感器 (上喇叭NTC)
spk2_ntc_name = "spkr-therm"        # NTC传感器 (下喇叭NTC)
battery_ntc_name = "battery"        # NTC传感器 (电池NTC)
spk1_ntc_adjust_degree = 0          # 上喇叭NTC温度加减调整（摄氏度）
spk2_ntc_adjust_degree = 0          # 下喇叭NTC温度加减调整（摄氏度）
battery_low = 5                     # 低电量阈值（0-20）


#
# Limit X/V
#
limit_x = -2                        # 降温的XMax值：-2db limitX
limit_v = -2                        # 降温的Vrms值：-2db limitV

#
# WhileList App set Level: 1~5
#
enable_whitelist = 0                # 默认关闭
whitelist_eq_lv = 1                 # 白名单应用的EQ等级（1~5），默认1级. (此参数在v1.10.0及以后版本有效)

#
# Expert:
#
# 温度映射公式：基本数学运算: + - * / ^ %, 三角函数，指数函数，log函数，e，pi等
# 公式长度不超过256字符.
#
# 可用参量：
#   f:  手机正面NTC温度
#   b:  电池NTC温度
#   t1: 上喇叭NTC温度 (加减调整后)
#   t2: 下喇叭NTC温度 (加减调整后)
#   c1: 上喇叭线圈温度
#   c2: 下喇叭线圈温度
#
## 手机正面壳温映射公式:
front_shell_tmpr_map = ""
## 上喇叭壳温映射公式:
spk1_shell_tmpr_map = ""
## 下喇叭壳温映射公式:
spk2_shell_tmpr_map = ""

