#
# Smart Audio Thermal Control
#
enable = 1                          # 总开关：1开启，0关闭

#
# 基本参数：
#

## 手机正面温度
front_ntc_high_tmpr = 44            # 当NTC升到此上限温度时，准备降温
## 上喇叭温度 
spk1_ntc_high_tmpr = 43             # 当NTC升到此上限温度时，准备降温
spk1_ntc_low_tmpr = 39              # 当NTC降到此下限温度时，准备恢复系数
## 下喇叭温度
spk2_ntc_high_tmpr = 43             # 当NTC升到此上限温度时，准备降温
spk2_ntc_low_tmpr = 39              # 当NTC降到此下限温度时，准备恢复系数

high_temp_seconds = 30              # 到达上限温度后的持续时间
low_temp_seconds = 30               # 到达下限温度后的持续时间
cooling_seconds = 30                # 当执行完降温策略后，延迟多少秒等待降温效果

#
# 高级参数：
#
front_ntc_name = "front_temp"       # NTC传感器 (手机正面NTC)
spk1_ntc_name = "spkr-therm"        # NTC传感器 (上喇叭NTC)
spk2_ntc_name = "spkr-therm"        # NTC传感器 (下喇叭NTC)
battery_low = 5			    # 手机低电量阈值
spk1_ntc_adjust_degree = 0          # 上喇叭NTC温度调整
spk2_ntc_adjust_degree = 0          # 下喇叭NTC温度调整

#
# Limit X/V
#
limit_x = -2                        # 降温的XMax值：-2db limitX
limit_v = -2                        # 降温的Vrms值：-2db limitV


#
# 以下为测试参数（仅在内部测试版本有效）
#
#
## 信号策略参数：（目前提供5档参数）
# signal_level_slot14 = 5 
# signal_level_slot15 = 5
#
## 指定生效的喇叭：
# test_speaker = 0                  # 1-Top, 2-Bottom, 0-Both
#

